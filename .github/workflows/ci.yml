# Continuous integration for hartos-command-center.
# Read-only checks only: no provider secrets are needed and no deploy happens here.
# Staging/production launches stay manual and gated (see docs/PRODUCTION_RELEASE_CONTROL.md).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, tests, and read-only verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Verify generated repo
        run: npm run verify

      - name: Local smoke
        run: npm run smoke:local

      - name: Launch plan (read-only)
        run: npm run launch:plan

      - name: Launch verify (read-only)
        run: npm run launch:verify

  # ── Staging deploy: merged = deployed ─────────────────────────────────────
  # Runs only on the default branch AND only when the repo opts in by setting
  # the repository variable ENABLE_STAGING_DEPLOY=true (Settings → Secrets and
  # variables → Actions → Variables) and adding the secrets below. Without the
  # opt-in this job is skipped, so CI stays green on forks/branches.
  # Production promotion is NEVER automatic (see docs/PRODUCTION_RELEASE_CONTROL.md).
  deploy-staging:
    name: Deploy cockpit Worker (merged = deployed)
    needs: verify
    # First armed deploy is best-effort (continue-on-error) so an unverified token scope cannot
    # redden the build; flip this off once a green deploy is confirmed to make it a real gate.
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/cloudflare-hosted-command-center' && vars.ENABLE_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency: cockpit-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy cockpit Worker + verify live SHA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Non-secret config — kept out of the public repo via Actions variables, and out of the
          # public log via env-injection (referenced as $V_* below, never echoed).
          V_ASK_WRITE_URL: ${{ vars.HARTOS_ASK_WRITE_URL }}
          V_OPS_URL: ${{ vars.HARTOS_OPS_SUPABASE_URL }}
          V_FITNESS_URL: ${{ vars.HARTOS_FITNESS_SUPABASE_URL }}
          V_FITNESS_USER: ${{ vars.HARTOS_FITNESS_USER_ID }}
          V_FITNESS_AGENT: ${{ vars.HARTOS_FITNESS_AGENT_ID }}
        run: |
          set -uo pipefail
          SHA="$(git rev-parse --short HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Generate the Worker config from Actions variables (values come from the runtime env, so
          # they never appear in the public log). Mirrors wrangler.cockpit.toml exactly.
          {
            echo 'name = "hartos-command-center"'
            echo 'main = "dist/src/runtime/cloudflare-cockpit-worker.js"'
            echo 'compatibility_date = "2026-06-03"'
            echo 'compatibility_flags = ["nodejs_compat"]'
            echo ''
            echo '[triggers]'
            echo 'crons = ["*/5 * * * *"]'
            echo ''
            echo '[vars]'
            echo 'APP_ENV = "production"'
            echo 'HARTOS_LLM_PROVIDER = "gemini"'
            echo 'HARTOS_LLM_ENABLE_NETWORK = "true"'
            echo 'HARTOS_GEMINI_MODEL = "gemini-2.5-flash-lite"'
            echo 'HARTOS_LLM_MODEL = "gpt-5.5"'
            echo "HARTOS_ASK_WRITE_URL = \"${V_ASK_WRITE_URL}\""
            echo "HARTOS_OPS_SUPABASE_URL = \"${V_OPS_URL}\""
            echo "HARTOS_FITNESS_SUPABASE_URL = \"${V_FITNESS_URL}\""
            echo "HARTOS_FITNESS_USER_ID = \"${V_FITNESS_USER}\""
            echo "HARTOS_FITNESS_AGENT_ID = \"${V_FITNESS_AGENT}\""
          } > wrangler.cockpit.toml
          # Deploy. wrangler output can echo var values, so capture to a file and only surface the
          # public Worker URL — never the generated config.
          if npx wrangler deploy --config wrangler.cockpit.toml --var BUILD_SHA:"$SHA" --var BUILD_TIME:"$BUILT_AT" > deploy.out 2>&1; then
            URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.out | head -1)"
            echo "Deployed cockpit @ $SHA -> ${URL:-<url not parsed>}"
            if [ -n "${URL:-}" ]; then
              sleep 6
              LIVE="$(curl -fsS "$URL/health" 2>/dev/null | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
              echo "live /health.version=${LIVE:-<none>}  expected=$SHA"
              if [ "${LIVE:-}" != "$SHA" ]; then echo "::error::deployed /health.version (${LIVE:-none}) != $SHA"; exit 1; fi
              echo "OK - live cockpit is running $SHA"
            fi
          else
            echo "::error::wrangler deploy failed (sanitized output below):"
            grep -aviE 'supabase\.co|f4167d7b|2a391749|persist-cockpit-proposal' deploy.out | tail -40
            exit 1
          fi
