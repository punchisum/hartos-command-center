# agent.yaml — test-agent
# Generated by HartOS Agent Factory v2 on 2026-06-03
# Fill all {{PLACEHOLDER}} values before deploying.
# See templates/agent.yaml.template for full contract documentation.

name: "test-agent"
owner: "Test Owner"
version: "0.1.0"
created_at: "2026-06-03"

environments:
  - name: staging
    supabase_project: "{{SUPABASE_PROJECT_REF_STAGING}}"
    cloudflare_worker: "{{CF_WORKER_NAME_STAGING}}"
    trigger_project: "{{TRIGGER_PROJECT_ID_STAGING}}"
  - name: production
    supabase_project: "{{SUPABASE_PROJECT_REF_PROD}}"
    cloudflare_worker: "{{CF_WORKER_NAME_PROD}}"
    trigger_project: "{{TRIGGER_PROJECT_ID_PROD}}"

interfaces:
  - type: telegram
    bot_username: "{{TELEGRAM_BOT_USERNAME}}"
    allowed_user_ids_env: "TELEGRAM_ALLOWED_USER_IDS"

commands:
  - name: "analyse"
    description: "Analyse an uploaded document"
    interface: telegram
    owner_runtime: cloudflare
    approval_required: false
    risky_mutation: false
    final_state: >
      Row in reports table with status=done, preview delivered to chat, debug_event with outcome=ok
  - name: "apply"
    description: "Apply approved analysis to ClickUp"
    interface: telegram
    owner_runtime: trigger
    approval_required: true
    risky_mutation: true
    final_state: >
      ClickUp task updated, action_tokens.consumed_at set, audit row written, debug_event outcome=ok

source_of_truth:
  provider: supabase
  url_env: "SUPABASE_URL"
  key_env: "SUPABASE_SERVICE_ROLE_KEY"
  key_tables:
    - "{{TABLE_1}}"

external_tools:
  - name: openai
    role: llm_provider
    is_source_of_truth: false
  - name: clickup
    role: visual_dashboard
    is_source_of_truth: false
    mutations_require_approval: true

# RULE: External IDs (Telegram, ClickUp, etc.) NEVER enter UUID columns.
identifier_contract:
  internal_uuid_columns:
    - "{{TABLE}}.id"
    - "{{TABLE}}.{{entity_type}}_id"
  external_text_columns:
    - "{{TABLE}}.telegram_chat_id"
    - "{{TABLE}}.telegram_user_id"
    - "{{TABLE}}.clickup_task_id"
  unresolved_target_policy: >-
    Set UUID column to null if external ID cannot be resolved.
    Preserve external ID in metadata JSONB. Never insert a provider ID into a UUID column.

risky_mutations:
  - action: "Update ClickUp task status to approved"
    runtime: trigger
    target: "clickup"
    approval_required: true
    approval_mechanism: callback_token
    rollback_possible: false
    rollback_notes: "{{HOW_TO_UNDO}}"

approval_requirements:
  default_policy: require_approval
  exceptions:
    - action: "analyse"
      reason: "Read-only or non-mutating operation"

# Telegram callback_data hard limit: 64 bytes. Use short tokens (tok ≤ 20 chars).
callback_token_contract:
  max_callback_data_bytes: 64
  token_fields:
    - tok
    - act
  token_table: "action_tokens"
  expiry_hours: 24
  consumed_after_successful_action_only: true
  chat_id_type: text
  user_id_type: text

# RULE: Idempotency keys must NEVER be based on LLM-generated text.
idempotency_contract:
  key_sources:
    - "record_id"
    - "date_string"
    - "job_run_id"
  forbidden_sources:
    - llm_generated_text
    - user_free_text
    - long_tokens_or_safeText_processed_strings

scheduled_jobs:
  - name: "daily-briefing"
    runtime: trigger
    cron: "0 9 * * 1-5"
    description: "Send daily briefing to all active chats"
    final_state: >
      briefing_runs row with outcome=ok, all messages delivered, delivery_log rows written

file_handling:
  enabled: true
  max_file_size_mb: 10
  supported_types:
    - docx
    - txt
    - csv
    - pdf

ocr_policy:
  enabled: true
  text_pdf_strategy: extract_directly
  scanned_pdf_strategy: attempt_ocr_then_degrade_honestly
  image_strategy: vision_path_or_degrade_honestly
  min_useful_chars: 100
  no_llm_analysis_if_below_threshold: true
  degrade_honestly: true
  record_extraction_status: true
  record_extraction_method: true
  record_char_count: true

observability:
  debug_events_table: "debug_events"
  required_event_fields:
    - trace_id
    - runtime
    - route
    - stage
    - outcome
    - failure_code
    - metadata
  forbidden_in_metadata:
    - raw_authorization_header
    - raw_api_key
    - raw_service_role_key
    - raw_long_token
  telegram_debug_channel_env: "TELEGRAM_DEBUG_CHAT_ID"
  throttle_debug_channel: true

deployment:
  gateway: cloudflare_workers
  workflow: trigger_dev
  database: supabase
  smoke_test_required: true
  smoke_must_prove_final_state: true

rollback:
  gateway_rollback: "Redeploy previous Cloudflare Worker version."
  workflow_rollback: "Disable Trigger.dev job, revert to previous version."
  database_rollback: "Apply reverting migration."
  data_repair_path: "{{DESCRIBE_DATA_REPAIR_PATH}}"
